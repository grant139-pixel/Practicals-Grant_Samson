<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type="text"],[type="email"]{
            width: 90%;
        }

        input{
            margin-bottom: 15px;
        }

        input{
            margin-bottom: 15px;
        }

        input:focus{
            outline: none;
            border: 2px solid grey;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Survey Form</h1>
    <form method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Please enter your name">
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="emial" name="email" placeholder="Please enter your email">
        <br><br>

        <label for="rates">Choose a rating</label>
        <select name="rates" id="rates">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        <br><br>

        <label for="for-yes">Yes</label>
        <input type="radio" id="yes" name="yes" value="yes">

        <label for="for-no">No</label>
        <input type="radio" id="no" name="no" value="no">
        <br><br>

        <input type="submit" value="Submit">

    </form>
</body>
</html>
