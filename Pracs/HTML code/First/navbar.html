<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to create a navigation bar</title>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="camera.jpeg">
        </div>
        <div class="lis">
            <ul>
                <li>Home</li>
                <li>About Us</li>
                <li>Services</li>
                <li>Contact Us</li>
            </ul>
        </div>
    </nav>
    
</body>
</html>
<style>
    nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: navy;
        padding: 10px;
    }

    .logo img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
    }

    .lis ul{
        padding: 10px;
        color: #fff;
       align-items: center ;
    }

    .lis ul li{
        padding: 10px;
        color: #fff;
        list-style: none;

    }


</style>
